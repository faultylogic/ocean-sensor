apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocean-sensor
  labels:
    app: ocean-sensor
spec:
  replicas: 1          # single replica — in-memory fleet state is not distributed
  selector:
    matchLabels:
      app: ocean-sensor
  template:
    metadata:
      labels:
        app: ocean-sensor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: ocean-sensor
          image: faultylogic/ocean-sensor:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          # ---- Environment from ConfigMap ----
          envFrom:
            - configMapRef:
                name: ocean-sensor-config

          # ---- Resource limits ----
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "4Gi"

          # ---- Health probes ----
          readinessProbe:
            httpGet:
              path: /ocean-overview/actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /ocean-overview/actuator/health/liveness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /ocean-overview/actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12    # allow up to 60 s for startup

          # ---- Graceful shutdown ----
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
